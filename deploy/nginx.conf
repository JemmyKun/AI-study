# 生产部署示例：同域托管 SPA 静态资源 + 反代 CopilotKit Runtime
#
# 使用方式（Ubuntu）：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/app-ts-01.conf
#   sudo ln -s /etc/nginx/sites-available/app-ts-01.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 假设：
#   前端构建产物：/var/www/app-ts-01/build
#   Runtime 服务：127.0.0.1:8200（PM2 守护，见 deploy/README.md）

server {
    listen 80;
    server_name app.example.com;

    root /var/www/app-ts-01/build;
    index index.html;

    # 静态资源缓存
    location /static/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 运行时配置不缓存，方便部署后直接改 config.js 生效
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CopilotKit Runtime（SSE 流式响应，必须关闭缓冲）
    location /api/copilotkit/ {
        proxy_pass http://127.0.0.1:8200/api/copilotkit/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式输出关键配置
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
